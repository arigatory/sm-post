---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-ui-config
  namespace: cqrs-app
data:
  KAFKA_CLUSTERS_0_NAME: "local"
  KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
  DYNAMIC_CONFIG_ENABLED: "true"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: cqrs-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
      - name: kafka-ui
        image: provectuslabs/kafka-ui:latest
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: kafka-ui-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: cqrs-app
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
    name: http
  selector:
    app: kafka-ui
