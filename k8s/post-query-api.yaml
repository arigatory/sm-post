---
apiVersion: v1
kind: ConfigMap
metadata:
  name: post-query-api-config
  namespace: cqrs-app
data:
  ASPNETCORE_ENVIRONMENT: "Development"
  ASPNETCORE_URLS: "http://+:5263"
  ConnectionStrings__PostgreSQL: "Host=postgres-read;Port=5432;Database=SocialMedia;Username=postgres;Password=1234"
  ConsumerConfig__BootstrapServers: "kafka:9092"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: post-query-api
  namespace: cqrs-app
spec:
  replicas: 2 # 2 replicas for high availability
  selector:
    matchLabels:
      app: post-query-api
  template:
    metadata:
      labels:
        app: post-query-api
    spec:
      containers:
      - name: post-query-api
        image: infra-post-query-api:latest
        imagePullPolicy: Never # For local Kubernetes (minikube/docker-desktop)
        ports:
        - containerPort: 5263
          name: http
        envFrom:
        - configMapRef:
            name: post-query-api-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /swagger/index.html
            port: 5263
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /swagger/index.html
            port: 5263
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3

---
apiVersion: v1
kind: Service
metadata:
  name: post-query-api
  namespace: cqrs-app
spec:
  type: NodePort
  ports:
  - port: 5263
    targetPort: 5263
    nodePort: 30263
    name: http
  selector:
    app: post-query-api
