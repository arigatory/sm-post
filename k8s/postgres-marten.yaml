---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-marten-pvc
  namespace: cqrs-app
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-marten-config
  namespace: cqrs-app
data:
  POSTGRES_DB: "eventstore"
  POSTGRES_USER: "postgres"

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-marten-secret
  namespace: cqrs-app
type: Opaque
data:
  POSTGRES_PASSWORD: cG9zdGdyZXM= # base64 encoded "postgres"

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-marten
  namespace: cqrs-app
spec:
  serviceName: postgres-marten
  replicas: 1 # Stateful service - single instance
  selector:
    matchLabels:
      app: postgres-marten
  template:
    metadata:
      labels:
        app: postgres-marten
    spec:
      containers:
      - name: postgres
        image: postgres:16
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: postgres-marten-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: postgres-marten-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-marten-secret
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: postgres-marten-storage
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: postgres-marten-storage
        persistentVolumeClaim:
          claimName: postgres-marten-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-marten
  namespace: cqrs-app
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres
  selector:
    app: postgres-marten
